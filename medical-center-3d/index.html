<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Медицинский центр · 3D</title>
<style>
  body { margin:0; overflow:hidden; font-family:'Segoe UI',sans-serif; background:#dfe4ea; }
  #ui { position:absolute; top:14px; left:14px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn {
    background:rgba(255,255,255,.95); border:1px solid #cfd6dd; border-radius:8px;
    padding:8px 14px; font-size:13px; cursor:pointer; color:#1a3a5c;
    box-shadow:0 2px 6px rgba(0,0,0,.08); transition:.15s; font-weight:600;
  }
  .btn:hover { background:#1a5490; color:#fff; border-color:#1a5490; }
  .btn.active { background:#1a5490; color:#fff; border-color:#1a5490; }
  #title {
    position:absolute; top:14px; right:14px; background:rgba(255,255,255,.95);
    padding:10px 16px; border-radius:8px; font-size:13px; color:#1a3a5c;
    box-shadow:0 2px 6px rgba(0,0,0,.08); line-height:1.5; text-align:right;
  }
  #title b { font-size:15px; }
  #tooltip {
    position:absolute; pointer-events:none; background:rgba(15,25,40,.92);
    color:#fff; padding:7px 13px; border-radius:6px; font-size:13px;
    display:none; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  #legend {
    position:absolute; bottom:14px; left:14px; background:rgba(255,255,255,.95);
    padding:11px 15px; border-radius:8px; font-size:12px; color:#334;
    box-shadow:0 2px 6px rgba(0,0,0,.08); line-height:1.7;
  }
  .sw { display:inline-block; width:13px; height:13px; border-radius:3px;
        vertical-align:middle; margin-right:6px; border:1px solid rgba(0,0,0,.1); }
  #floorSelector {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.95); padding:6px; border-radius:10px;
    display:flex; gap:4px; box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  #floorSelector .btn { padding:6px 12px; font-size:12px; }
</style>
</head>
<body>

<div id="ui">
  <button class="btn" id="btnWalls">👁 Прозрачные стены</button>
  <button class="btn" id="btnTop">⤒ Вид сверху</button>
  <button class="btn" id="btnIso">◇ Изометрия</button>
  <button class="btn" id="btnFurniture">▭ Мебель вкл</button>
  <button class="btn" id="btnReset">↻ Сброс</button>
</div>

<div id="floorSelector">
  <button class="btn" data-floor="basement">Цоколь</button>
  <button class="btn active" data-floor="1">1 этаж</button>
  <button class="btn" data-floor="2">2 этаж</button>
  <button class="btn" data-floor="3">3 этаж</button>
</div>

<div id="title">
  <b>Медицинский центр · 3D</b><br>
  ЛКМ — вращение · Колесо — зум · ПКМ — сдвиг<br>
  Наведи на комнату — увидишь название
</div>

<div id="legend"></div>
<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./src/main.js"></script>
</body>
</html>
